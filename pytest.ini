[pytest]
minversion = 9.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config --durations=10 -m "not cad"
markers =
    cad: requires CadQuery; run with `pytest -o addopts="" -m cad`
tmp_path_retention_policy = failed
